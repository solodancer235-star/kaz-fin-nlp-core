# Jenkins Configuration as Code: the whole server (users, credentials, job) is
# defined here, so a fresh controller is ready without clicking through the UI.
# Secrets come from environment variables / files provided by docker-compose.
jenkins:
  systemMessage: "kaz-fin-nlp-core CI/CD server (Assignment 5) - configured as code"
  numExecutors: 2
  securityRealm:
    local:
      allowsSignup: false
      users:
        - id: "${JENKINS_ADMIN_ID:-admin}"
          password: "${JENKINS_ADMIN_PASSWORD:-admin}"
  authorizationStrategy:
    loggedInUsersCanDoAnything:
      allowAnonymousRead: true

unclassified:
  location:
    url: "http://localhost:8080/"

credentials:
  system:
    domainCredentials:
      - credentials:
          - usernamePassword:
              scope: GLOBAL
              id: "dockerhub-creds"
              description: "Docker Hub access token"
              username: "${DOCKERHUB_USER:-changeme}"
              password: "${DOCKERHUB_TOKEN:-changeme}"
          - file:
              scope: GLOBAL
              id: "minikube-kubeconfig"
              description: "kubeconfig for the Minikube cluster"
              fileName: "kubeconfig"
              secretBytes: "${readFileBase64:/run/secrets/kubeconfig}"

jobs:
  - script: |
      multibranchPipelineJob('kaz-fin-nlp-core') {
        displayName('kaz-fin-nlp-core')
        description('CI/CD for the Kazakhstani NLP Financial News System')
        branchSources {
          git {
            id('kaz-fin-nlp-core-git')
            remote('https://github.com/solodancer235-star/kaz-fin-nlp-core.git')
          }
        }
        triggers {
          periodicFolderTrigger { interval('1m') }
        }
        orphanedItemStrategy {
          discardOldItems { numToKeep(5) }
        }
      }
