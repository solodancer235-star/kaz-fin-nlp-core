# Local Jenkins server.  Start:  docker compose -f jenkins/docker-compose.yml up -d --build
# UI: http://localhost:8080   initial password:
#   docker exec jenkins cat /var/jenkins_home/secrets/initialAdminPassword
services:
  jenkins:
    build: .
    container_name: jenkins
    user: root            # needed to use the host Docker socket in a lab setup
    ports:
      - "8080:8080"
      - "50000:50000"
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped

volumes:
  jenkins_home:
