[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kaz-fin-nlp-core"
version = "0.1.0"
description = "Bilingual (Kazakh & Russian) Financial NLP, Sentiment Analysis, and Compliance Processing Engine"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Kassym", email = "solodancer235-star@users.noreply.github.com" }
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing :: Linguistic"
]
dependencies = [
    "pydantic>=2.0.0",
    "numpy>=1.24.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "black>=23.0.0",
    "flake8>=6.0.0",
    "mypy>=1.5.0",
    "bandit>=1.7.5",
    "build>=1.0.0",
    "twine>=4.0.2"
]

[project.scripts]
kaz-fin-nlp = "kaz_fin_nlp.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["kaz_fin_nlp"]

[tool.black]
line-length = 88
target-version = ["py310"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --cov=kaz_fin_nlp --cov-report=term-missing --cov-report=xml"
